name: forohub
services:
  usuarios:
    build: ./backend/usuarios-service
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:h2:file:/app/data/usuarios;DB_CLOSE_ON_EXIT=FALSE
    volumes: ["usuarios_data:/app/data"]
    restart: unless-stopped
  foro:
    build: ./backend/foro-service
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:h2:file:/app/data/foro;DB_CLOSE_ON_EXIT=FALSE
    volumes: ["foro_data:/app/data"]
    restart: unless-stopped
  moderacion:
    build: ./backend/moderacion-service
    ports: ["8083:8083"]
    environment:
      DB_URL: jdbc:h2:file:/app/data/moderacion;DB_CLOSE_ON_EXIT=FALSE
      FORO_API_URL: http://foro:8082
    volumes: ["moderacion_data:/app/data"]
    depends_on: [foro]
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["8080:80"]
    restart: unless-stopped
volumes:
  usuarios_data:
  foro_data:
  moderacion_data:
